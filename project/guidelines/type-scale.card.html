<!-- @dsCard group="Type" viewport="700x300" name="Type scale" subtitle="Public Sans display → body, fluid scale" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface); color: var(--text-strong); padding: 24px 28px; }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 7px 0; border-bottom: 1px solid var(--divider); }
  .row:last-child { border-bottom: none; }
  .tag { font-family: var(--font-mono); font-size: 11px; color: var(--text-subtle); width: 132px; flex: none; }
  .spec { font-family: var(--font-sans); color: var(--text-strong); letter-spacing: var(--tracking-tight); line-height: 1.05; white-space: nowrap; }
</style></head>
<body>
  <div class="row"><span class="tag">5xl · 54 / 800</span><span class="spec" style="font-size:var(--text-5xl);font-weight:800">Grad Fund</span></div>
  <div class="row"><span class="tag">3xl · 33 / 700</span><span class="spec" style="font-size:var(--text-3xl);font-weight:700">Portfolio overview</span></div>
  <div class="row"><span class="tag">xl · 22 / 600</span><span class="spec" style="font-size:var(--text-xl);font-weight:600">Holdings & watchlists</span></div>
  <div class="row"><span class="tag">lg · 18 / 600</span><span class="spec" style="font-size:var(--text-lg);font-weight:600">Section heading</span></div>
  <div class="row"><span class="tag">base · 15 / 400</span><span class="spec" style="font-size:var(--text-base);font-weight:400;letter-spacing:0">Body copy — calm, plain, low-jargon for every reader.</span></div>
</body></html>
