<!-- @dsCard group="Colors" viewport="700x150" name="Neutral · Warm slate" subtitle="Text, borders, surfaces; slight green cast" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface); padding: 22px 28px; }
  .ramp { display: flex; gap: 0; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border); }
  .sw { flex: 1; height: 76px; display: flex; align-items: flex-end; padding: 7px; }
  .n { font-family: var(--font-mono); font-size: 10px; font-weight: 600; }
  .cap { margin-top: 10px; font-family: var(--font-sans); font-size: 12px; color: var(--text-muted); }
  .cap b { color: var(--text-strong); font-family: var(--font-mono); }
</style></head>
<body>
  <div class="ramp">
    <div class="sw" style="background:var(--gray-0);box-shadow:inset 0 0 0 1px var(--border)"><span class="n" style="color:var(--gray-600)">0</span></div>
    <div class="sw" style="background:var(--gray-50)"><span class="n" style="color:var(--gray-600)">50</span></div>
    <div class="sw" style="background:var(--gray-100)"><span class="n" style="color:var(--gray-600)">100</span></div>
    <div class="sw" style="background:var(--gray-200)"><span class="n" style="color:var(--gray-700)">200</span></div>
    <div class="sw" style="background:var(--gray-300)"><span class="n" style="color:var(--gray-700)">300</span></div>
    <div class="sw" style="background:var(--gray-400)"><span class="n" style="color:#fff">400</span></div>
    <div class="sw" style="background:var(--gray-500)"><span class="n" style="color:#fff">500</span></div>
    <div class="sw" style="background:var(--gray-600)"><span class="n" style="color:#fff">600</span></div>
    <div class="sw" style="background:var(--gray-700)"><span class="n" style="color:#fff">700</span></div>
    <div class="sw" style="background:var(--gray-800)"><span class="n" style="color:#fff">800</span></div>
    <div class="sw" style="background:var(--gray-900)"><span class="n" style="color:#fff">900</span></div>
  </div>
  <div class="cap"><b>--text-strong</b> 900 · <b>--text</b> 800 · <b>--text-muted</b> 600 · <b>--border</b> 200 · <b>--bg-app</b> 50.</div>
</body></html>
