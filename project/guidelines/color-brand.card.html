<!-- @dsCard group="Colors" viewport="700x150" name="Brand · Evergreen" subtitle="Primary brand ramp; --brand = 600" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface); padding: 22px 28px; }
  .ramp { display: flex; gap: 0; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border); }
  .sw { flex: 1; height: 76px; display: flex; align-items: flex-end; padding: 7px; }
  .n { font-family: var(--font-mono); font-size: 10px; font-weight: 600; }
  .cap { margin-top: 10px; font-family: var(--font-sans); font-size: 12px; color: var(--text-muted); }
  .cap b { color: var(--text-strong); font-family: var(--font-mono); }
</style></head>
<body>
  <div class="ramp">
    <div class="sw" style="background:var(--evergreen-50)"><span class="n" style="color:var(--evergreen-700)">50</span></div>
    <div class="sw" style="background:var(--evergreen-100)"><span class="n" style="color:var(--evergreen-700)">100</span></div>
    <div class="sw" style="background:var(--evergreen-200)"><span class="n" style="color:var(--evergreen-800)">200</span></div>
    <div class="sw" style="background:var(--evergreen-300)"><span class="n" style="color:var(--evergreen-900)">300</span></div>
    <div class="sw" style="background:var(--evergreen-400)"><span class="n" style="color:#fff">400</span></div>
    <div class="sw" style="background:var(--evergreen-500)"><span class="n" style="color:#fff">500</span></div>
    <div class="sw" style="background:var(--evergreen-600)"><span class="n" style="color:#fff">600</span></div>
    <div class="sw" style="background:var(--evergreen-700)"><span class="n" style="color:#fff">700</span></div>
    <div class="sw" style="background:var(--evergreen-800)"><span class="n" style="color:#fff">800</span></div>
    <div class="sw" style="background:var(--evergreen-900)"><span class="n" style="color:#fff">900</span></div>
  </div>
  <div class="cap">Primary action & brand. <b>--brand</b> = 600, <b>--brand-strong</b> = 700, <b>--brand-soft</b> = 50.</div>
</body></html>
