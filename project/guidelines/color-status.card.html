<!-- @dsCard group="Colors" viewport="700x140" name="Status & asset classes" subtitle="Caution / info, plus per-asset-class accents" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface); padding: 20px 28px; }
  .grp { display:flex; flex-wrap:wrap; gap: 10px; }
  .chip { display:inline-flex; align-items:center; gap:8px; padding:7px 12px 7px 10px; border-radius: var(--radius-pill); background: var(--surface-sunken); border: 1px solid var(--border); font-family: var(--font-sans); font-size: 12px; font-weight: 600; color: var(--text); }
  .dot { width:11px; height:11px; border-radius: 50%; flex:none; }
  .h { font-family: var(--font-mono); font-size: 11px; color: var(--text-subtle); margin: 0 0 9px; }
  .h:not(:first-child){ margin-top: 14px; }
</style></head>
<body>
  <div class="h">STATUS</div>
  <div class="grp">
    <span class="chip"><span class="dot" style="background:var(--amber-500)"></span>Caution · --amber-500</span>
    <span class="chip"><span class="dot" style="background:var(--blue-500)"></span>Info · --blue-500</span>
    <span class="chip"><span class="dot" style="background:var(--violet-500)"></span>Series · --violet-500</span>
  </div>
  <div class="h">ASSET CLASSES</div>
  <div class="grp">
    <span class="chip"><span class="dot" style="background:var(--asset-stock)"></span>Stock</span>
    <span class="chip"><span class="dot" style="background:var(--asset-etf)"></span>ETF / Fund</span>
    <span class="chip"><span class="dot" style="background:var(--asset-bond)"></span>Bond</span>
    <span class="chip"><span class="dot" style="background:var(--asset-future)"></span>Future</span>
    <span class="chip"><span class="dot" style="background:var(--asset-option)"></span>Option</span>
    <span class="chip"><span class="dot" style="background:var(--asset-crypto)"></span>Crypto</span>
    <span class="chip"><span class="dot" style="background:var(--asset-cash)"></span>Cash</span>
  </div>
</body></html>
